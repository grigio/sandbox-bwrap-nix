name: Update version badges

on:
  push:
    branches: [master]
  schedule:
    # daily at 05:00 UTC; versions change when flake.lock is bumped or when
    # pins in flake.nix move (e.g. reasonix, maki)
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: version-badges
  cancel-in-progress: true

jobs:
  badges:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-nix

      - name: Regenerate opencode, jcode, pi-coding-agent, reasonix, maki and deepseek-harness badges
        run: bash scripts/update-badges.sh

      - name: Commit badge updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add badges/*.json
          if git diff --cached --quiet; then
            echo "Badges unchanged, nothing to commit"
          else
            git commit -m "badges: update opencode/jcode/pi-coding-agent/reasonix/maki/deepseek-harness versions"
            git push
          fi
