name: update-flake-lock

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - name: configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: update flake.lock
        run: nix flake update

      - name: commit flake.lock
        run: |
          git add flake.lock
          git commit -m "chore: weekly flake.lock update"

      - name: validate flake
        run: nix flake check --all-systems

      - name: print opencode version
        run: nix develop --command opencode --version

      - name: push branch
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git branch -f auto/update-flake-lock
          git push origin auto/update-flake-lock --force

      - name: create PR
        id: create-pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_URL=$(gh pr create \
            --base main \
            --head auto/update-flake-lock \
            --title "chore: weekly flake.lock update" \
            --body "Automated weekly \`flake.lock\` update.
            - \`nix flake update\` bumped all inputs to latest.
            - Validated with \`nix flake check --all-systems\`.") || true
          echo "pr-url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: merge PR
        if: steps.create-pr.outputs.pr-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge --squash "${{ steps.create-pr.outputs.pr-url }}" || true
