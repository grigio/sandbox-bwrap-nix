name: daily flake.lock + badges update

on:
  workflow_dispatch:
  schedule:
    # daily at 06:00 UTC: bump nixpkgs + jcode inputs, then refresh badges
    - cron: "0 6 * * *"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: flake-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-nix

      - name: configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Updates all inputs: nixpkgs and the jcode flake (github:grigio/jcode).
      # jcode-src (1jehuang/jcode) is an internal input of the grigio/jcode
      # flake and is resolved transitively, no special handling needed.
      - name: update flake.lock (nixpkgs + jcode)
        run: nix flake update

      - name: validate flake
        run: nix flake check --all-systems

      - name: regenerate version badges from the new lock
        run: bash scripts/update-badges.sh

      - name: commit flake.lock and badges
        id: commit
        run: |
          git add flake.lock badges/
          if git diff --cached --quiet; then
            echo "Lock already current and badges up to date, nothing to commit"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: daily flake.lock + version badges update"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: fix Nix daemon and database permissions
        if: steps.commit.outputs.changed == 'true'
        run: |
          sudo mkdir -p /nix/var/nix/db
          sudo mkdir -p /nix/var/nix/builds
          sudo chown -R root:root /nix
          sudo chmod 755 /nix
          sudo chmod 755 /nix/var
          sudo chmod 755 /nix/var/nix
          sudo chmod 755 /nix/var/nix/db
          sudo systemctl restart nix-daemon || true

      - name: install bubblewrap and configure subuids
        if: steps.commit.outputs.changed == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap uidmap
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 runner
          sudo chmod u+s /usr/bin/newuidmap /usr/bin/newgidmap

      - name: run sandbox smoke tests
        if: steps.commit.outputs.changed == 'true'
        run: |
          ./start-sandbox.sh opencode --version
          ./start-sandbox.sh jcode --version
          ./start-sandbox.sh pi --version
          ./start-sandbox.sh reasonix --version
          ./start-sandbox.sh maki --version
          ./start-sandbox.sh dsh --version

      - name: push branch
        if: steps.commit.outputs.changed == 'true'
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git branch -f auto/update-flake-lock
          git push origin auto/update-flake-lock --force

      - name: create PR
        id: create-pr
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_BODY="Automated daily \`nix flake update\` (nixpkgs and jcode inputs).
          - Validated with \`nix flake check --all-systems\`.
          - Sandbox smoke-tested with opencode, jcode, pi-coding-agent, reasonix, maki and deepseek-harness.
          - Version badges regenerated from the new lock."
          # Reuse an existing open PR from a previous run instead of stacking
          # a second one for the same auto/update-flake-lock branch.
          PR_URL=$(gh pr list --head auto/update-flake-lock --base master --json url --jq '.[0].url' 2>/dev/null || true)
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --base master \
              --head auto/update-flake-lock \
              --title "chore: daily flake.lock + badges update" \
              --body "$PR_BODY") || true
          fi
          echo "pr-url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: merge PR
        if: steps.create-pr.outputs.pr-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge --squash --delete-branch "${{ steps.create-pr.outputs.pr-url }}" \
            --subject "chore: daily flake.lock + badges update" || \
            echo "PR not auto-merged (checks pending or conflict); merge manually"
