name: update maki pin

# Keeps the maki version/hash pins in flake.nix on the latest GitHub release.
# Maki ships a single vX.Y.Z release track, so we check weekly (every 7 days).
#
# Flow: scripts/update-maki.sh bumps the pins and validates with
# `nix build .#maki`; if something changed we flake-check, smoke-test the
# sandbox, refresh the version badges, then auto-merge a PR (same pattern as
# update-reasonix.yml).

on:
  workflow_dispatch:
  schedule:
    # weekly on Sunday at 05:00 UTC
    - cron: "0 5 * * 0"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: maki-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            extra-substituters = https://grigio.github.io/jcode
            extra-trusted-public-keys = grigio-jcode:WdqguwKdwOilH+ITvLO98qZy9x5HQ8Cl0xltHtSsUvQ=

      - name: configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Reads the latest vX.Y.Z release, rewrites the version and hash pins in
      # flake.nix, then verifies with `nix build .#maki`. Sets outputs.changed
      # so the remaining steps skip when nothing to do.
      - name: bump maki pin
        id: maki
        run: bash scripts/update-maki.sh

      - name: validate flake
        if: steps.maki.outputs.changed == 'true'
        run: nix flake check --all-systems

      - name: regenerate version badges from the new pin
        if: steps.maki.outputs.changed == 'true'
        run: bash scripts/update-badges.sh

      - name: commit flake.nix and badges
        if: steps.maki.outputs.changed == 'true'
        run: |
          git add flake.nix badges/
          git diff --cached --quiet || \
            git commit -m "chore: bump maki to latest release"

      - name: fix Nix daemon and database permissions
        if: steps.maki.outputs.changed == 'true'
        run: |
          sudo mkdir -p /nix/var/nix/db
          sudo mkdir -p /nix/var/nix/builds
          sudo chown -R root:root /nix
          sudo chmod 755 /nix
          sudo chmod 755 /nix/var
          sudo chmod 755 /nix/var/nix
          sudo chmod 755 /nix/var/nix/db
          sudo systemctl restart nix-daemon || true

      - name: install bubblewrap and configure subuids
        if: steps.maki.outputs.changed == 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap uidmap
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 runner
          sudo chmod u+s /usr/bin/newuidmap /usr/bin/newgidmap

      - name: run sandbox smoke test (maki)
        if: steps.maki.outputs.changed == 'true'
        run: ./start-sandbox.sh maki --version

      - name: push branch
        if: steps.maki.outputs.changed == 'true'
        env:
          GIT_TERMINAL_PROMPT: "0"
        run: |
          git remote set-url origin https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          git branch -f auto/update-maki
          git push origin auto/update-maki --force

      - name: create PR
        id: create-pr
        if: steps.maki.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_BODY='Automated maki pin update from scripts/update-maki.sh.
          - Validated with nix build .#maki and nix flake check --all-systems.
          - Sandbox smoke-tested with start-sandbox.sh maki --version.
          - Version badges regenerated.'
          # Reuse an existing open PR from a previous run instead of stacking
          # a second one for the same auto/update-maki branch.
          PR_URL=$(gh pr list --head auto/update-maki --base master --json url --jq '.[0].url' 2>/dev/null || true)
          if [ -z "$PR_URL" ]; then
            PR_URL=$(gh pr create \
              --base master \
              --head auto/update-maki \
              --title "chore: bump maki to latest release" \
              --body "$PR_BODY") || true
          fi
          echo "pr-url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: merge PR
        if: steps.create-pr.outputs.pr-url != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge --squash --delete-branch "${{ steps.create-pr.outputs.pr-url }}" \
            --subject "chore: bump maki to latest release" || \
            echo "PR not auto-merged (checks pending or conflict); merge manually"
