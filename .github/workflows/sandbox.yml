name: sandbox

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap uidmap

      - name: Fix uidmap permissions for bwrap
        run: sudo chmod u+s /usr/bin/newuidmap /usr/bin/newgidmap

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v4

      - name: Run sandbox test
        run: ./start-sandbox.sh opencode --version
