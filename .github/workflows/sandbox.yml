name: sandbox

on: [push]

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@v16

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap uidmap

      - name: Configure subuid/subgid for runner user
        run: |
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 runner
          sudo chmod u+s /usr/bin/newuidmap /usr/bin/newgidmap

      - name: Ensure /nix/var/nix is accessible without daemon
        run: |
          sudo mkdir -p /nix/var/nix/builds
          sudo chmod -R 777 /nix/var/nix

      - name: Run sandbox test
        run: ./start-sandbox.sh opencode --version
