name: sandbox

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-nix

      - name: Fix Nix daemon and database permissions
        run: |
          sudo mkdir -p /nix/var/nix/db
          sudo mkdir -p /nix/var/nix/builds
          sudo chown -R root:root /nix
          sudo chmod 755 /nix
          sudo chmod 755 /nix/var
          sudo chmod 755 /nix/var/nix
          sudo chmod 755 /nix/var/nix/db
          sudo systemctl restart nix-daemon || true

      - name: Check flake evaluation
        run: nix flake check

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap uidmap

      - name: Configure subuid/subgid for runner user
        run: |
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 runner
          sudo chmod u+s /usr/bin/newuidmap /usr/bin/newgidmap

      - name: Run sandbox test (opencode)
        run: ./start-sandbox.sh opencode --version

      - name: Run sandbox test (jcode)
        run: ./start-sandbox.sh jcode --version

      - name: Run sandbox test (pi-coding-agent)
        run: ./start-sandbox.sh pi --version

      - name: Run sandbox test (maki)
        run: ./start-sandbox.sh maki --version

      - name: Run sandbox test (deepseek-harness)
        run: ./start-sandbox.sh dsh --version
