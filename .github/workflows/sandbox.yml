name: sandbox

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix + bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y nix-bin nix-setup-systemd bubblewrap uidmap

      - name: Configure subuid/subgid for runner user
        run: |
          sudo usermod --add-subuids 100000-165535 --add-subgids 100000-165535 runner
          sudo chmod u+s /usr/bin/newuidmap /usr/bin/newgidmap

      - name: Enable flakes in nix config
        run: |
          echo "experimental-features = nix-command flakes" | sudo tee /etc/nix/nix.conf

      - name: Start nix daemon
        run: sudo systemctl start nix-daemon

      - name: Run sandbox test
        run: ./start-sandbox.sh opencode --version
