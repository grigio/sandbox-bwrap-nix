name: sandbox

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Nix + bubblewrap
        run: sudo apt-get update && sudo apt-get install -y nix-bin nix-setup-systemd bubblewrap

      - name: Run sandbox test
        run: sudo ./start-sandbox.sh opencode --version
