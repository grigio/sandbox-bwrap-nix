name: sandbox

on: [push]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v4

      - name: Check environment
        run: |
          echo "=== PATH ==="
          echo "$PATH"
          echo "=== which nix ==="
          command -v nix || echo "nix not in PATH"
          echo "=== /usr/bin/nix ==="
          ls -la /usr/bin/nix 2>&1 || echo "not found"
          echo "=== /nix/store ==="
          ls /nix/store/ 2>&1 | head -5 || echo "empty"
          echo "=== TERM ==="
          echo "'$TERM'"

      - name: Run sandbox test
        run: ./start-sandbox.sh opencode --version
